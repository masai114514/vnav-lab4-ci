name: official-race

# 手动触发。默认参数 = 「官方原样 + 已认过的修复（have_desired / hz=200）+ CPU 让给控制栈」。
# 历史：Run 1–7 依次排掉 shell/set -u/就绪判据/local 语法/python 解释器/apt 包名/自检误报，
# Run 8 首次全绿（609 s），拿到官方 Unity 的 bag + 视频 + lag_probe + osc_report。
# Run 8 的结论：**滞后被证伪**（/current_state lag p95=60 ms < 姿态环 83 ms 时间常数），
# 但控制回路只跑到 41 Hz（设定 200），且控制器输出有 47% 的时间处于 >100 ms 空档
# → 新的头号嫌疑是 **CPU 抢占**。所以本轮的默认值把优先级倒过来给控制栈。
on:
  workflow_dispatch:
    inputs:
      res:
        description: 'Unity 渲染分辨率 WxH'
        required: false
        default: '640x400'
      ctrl_hz:
        description: '控制回路频率 /hz（官方起点是 1000）'
        required: false
        default: '200'
      ctrl_nice:
        description: '控制栈 renice 档数（正数 = 提优先级；0 = 不动）'
        required: false
        default: '5'
      unity_nice:
        description: 'Unity/录屏 renice 档数（正数 = 降优先级）'
        required: false
        default: '10'
      lp_threads:
        description: 'llvmpipe 渲染线程数（留出 vCPU 给 ROS）'
        required: false
        default: '2'
      unity_boot_wait:
        description: '等 Unity 监听 9001 的超时 [s]'
        required: false
        default: '240'
      race_timeout:
        description: '竞速墙钟兜底超时 [s]'
        required: false
        default: '900'
      lag_duration:
        description: 'lag_probe 采样时长 [s]（0 = 不跑）'
        required: false
        default: '120'
      capfps:
        description: '录屏帧率'
        required: false
        default: '6'
      upscale:
        description: '上采样交付分辨率（留空 = 不上采样）'
        required: false
        default: '1280x800'
      arm_key:
        description: 'Unity 上电键（留空 = 不发键）'
        required: false
        default: 'w'
      bag_only:
        description: '1 = 只出 bag 不录屏（省 CPU，纯算法迭代用）'
        required: false
        default: '0'
      publish_imu:
        description: '桥接是否发 IMU（我们的控制器不读它，默认关掉省 CPU）'
        required: false
        default: 'false'
      probe_only:
        description: '1 = 只跑快探针（不竞速），0 = 跑完整链路'
        required: false
        default: '0'

# 最低读写权限：读仓 + 上传 artifact
permissions:
  contents: read

jobs:
  race:
    name: 官方 Unity 竞速
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    # 直接跑在 ros:noetic-ros-base 里：runner 本身是原生 x86_64，
    # 容器给的是原版 focal + Noetic，所以既没有 Rosetta（Mono 断言崩溃的根因），
    # 也不用在 22.04 上折腾 RoboStack。
    #
    # --cap-add=SYS_NICE : 让控制栈的 `nice -n -5` 生效（Docker 默认能力集不含它）。
    #                      ⚠️ Run 8 之前这个 cap 是用在 **Unity** 上的 —— 方向错了：
    #                      渲染器优先会造成控制器被饿（实测控制回路只有 41 Hz / 设 200）。
    # --shm-size=2g      : Unity 默认的 64 MB /dev/shm 不够。
    container:
      image: ros:noetic-ros-base
      options: --user root --shm-size=2g --cap-add=SYS_NICE

    steps:
      - uses: actions/checkout@v4

      # 注意：容器 job 里 runner 给的默认 shell 是 `sh`（dash），不是 bash ——
      # 实测报 `set: Illegal option -o pipefail`，脚本一步都没跑。
      # 所以凡是 run: 都要显式 `shell: bash`（GH 的 bash 模板已是
      # `bash --noprofile --norc -eo pipefail`，自带 -e 与 pipefail）。
      #
      # 另外：`${{ github.workspace }}` 在这里求值成**主机**路径
      # /home/runner/work/...，而容器内 `$GITHUB_WORKSPACE` 是 /__w/...。
      # 两者指向同一个挂载，但字符串不同；为避免踩坑，一律用 step 的工作目录
      # （脚本里直接 $PWD），不用表达式插值。
      - name: 环境信息（公开仓 4 vCPU / 私有仓 2 vCPU）
        shell: bash
        run: |
          echo "vCPU     = $(nproc)"
          free -m | awk '/Mem:/{printf "内存     = %s MB\n", $2}'
          grep -E '^PRETTY_NAME' /etc/os-release || true
          echo "工作目录 = $PWD"
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          echo "--- ROS 版本"
          ls /opt/ros/noetic/share | wc -l | awk '{print "  /opt/ros/noetic/share 下 $1 个包"}'

      - name: 快探针（probe_only=1）
        if: ${{ inputs.probe_only == '1' }}
        shell: bash
        env:
          RES: ${{ inputs.res }}
          XVFB_RES: ${{ inputs.res }}
          UNITY_BOOT_WAIT: ${{ inputs.unity_boot_wait }}
        run: |
          set -o pipefail
          export OUT="$PWD/out"
          export BUNDLE="$PWD/lab4"
          mkdir -p "$OUT"
          echo "OUT=$OUT  BUNDLE=$BUNDLE"
          bash ci/probe_unity.sh 2>&1 | tee "$OUT/probe_console.log"

      - name: 完整竞速链路
        if: ${{ inputs.probe_only != '1' }}
        shell: bash
        env:
          RES: ${{ inputs.res }}
          XVFB_RES: ${{ inputs.res }}
          CTRL_HZ: ${{ inputs.ctrl_hz }}
          UNITY_BOOT_WAIT: ${{ inputs.unity_boot_wait }}
          RACE_TIMEOUT: ${{ inputs.race_timeout }}
          LAG_DURATION: ${{ inputs.lag_duration }}
          CAPFPS: ${{ inputs.capfps }}
          UPSCALE: ${{ inputs.upscale }}
          ARM_KEY: ${{ inputs.arm_key }}
          BAG_ONLY: ${{ inputs.bag_only }}
          PUBLISH_IMU: ${{ inputs.publish_imu }}
          CTRL_NICE: ${{ inputs.ctrl_nice }}
          UNITY_NICE: ${{ inputs.unity_nice }}
          LP_NUM_THREADS: ${{ inputs.lp_threads }}
        run: |
          # 没有这行，`... | tee log` 的退出码会被 tee 吃掉 ——
          # 上一轮就是因此「空产物 + conclusion=success」。
          set -o pipefail
          export OUT="$PWD/out"
          export BUNDLE="$PWD/lab4"
          mkdir -p "$OUT"
          echo "OUT=$OUT"
          echo "BUNDLE=$BUNDLE"
          bash ci/official_race.sh 2>&1 | tee "$OUT/console.log"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-race
          # 只传「有意义的结果」。**不要**写成 `path: out/` ——
          # out/ 里还躺着 lab4.zip(52 MB) 与解包出来的 Unity 构建(几百 MB)，
          # 实测那样每趟 artifact 109 MB，全是中间垃圾：下载慢到被杀、
          # 还白占配额。结果类文件总共只有几 MB。
          path: |
            out/*.log
            out/*.txt
            out/*.json
            out/*.csv
            out/*.bag
            out/*.mp4
            out/*.png
            out/roslog/**
          retention-days: 14
          if-no-files-found: warn

      - name: 结论摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## 官方 Unity 竞速 — 摘要"
            echo
            echo "- vCPU: $(nproc)"
            echo
            if [ -f out/lag_probe.txt ]; then
              echo '### /current_state 滞后实测（★ 核心指标）'
              echo '```'
              sed -n '1,60p' out/lag_probe.txt || true
              echo '```'
            else
              echo '_没有 lag_probe.txt_'
            fi
            echo
            if [ -f out/osc_report.txt ]; then
              echo '### xyz 振荡报告'
              echo '```'
              sed -n '1,80p' out/osc_report.txt || true
              echo '```'
            fi
            echo
            if [ -f out/metrics.json ]; then
              echo '### metrics.json'
              echo '```json'
              cat out/metrics.json || true
              echo '```'
            fi
            echo
            echo '### 控制器自报（roslog —— Run 8 之前一直没被收进产物）'
            echo '```'
            grep -ah 'Control loop rate\|Controller engaged\|First desired state received' \
              out/roslog/*/*.log 2>/dev/null | head -6 || echo '(没找到)'
            echo '```'
            echo
            echo '### 产物清单'
            echo '```'
            ls -la out/ 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
